services:
  minio01:
    image: quay.io/minio/aistor/minio:latest
    container_name: minio01
    command: server /data --console-address ":9001" --license /minio.license
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio01_data:/data
      - ./minio.license:/minio.license:ro
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: 
      - minio-lab

  minio02:
    image: quay.io/minio/aistor/minio:latest
    container_name: minio02
    command: server /data --console-address ":9001" --license /minio.license
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio02_data:/data
      - ./minio.license:/minio.license:ro
    ports:
      - "9010:9000"
      - "9011:9001"
    networks: 
      - minio-lab

  mc:
    image: quay.io/minio/mc:latest
    container_name: mc
    depends_on:
      - minio01
      - minio02
    entrypoint: /bin/sh
    stdin_open: true
    tty: true
    networks:
      - minio-lab

volumes:
  minio01_data:
  minio02_data:

networks:
  minio-lab:
